[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gfal-tui"
version = "0.1.0"
description = "Standalone Textual TUI for browsing and copying data with gfal."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Luis Antonio Obis Aparicio", email = "luis.obis@cern.ch" },
]
dependencies = [
    "gfal",
    "rich>=13.0.0",
    "textual>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pre-commit>=3.0",
    "codespell>=2.4.2",
]

[project.scripts]
gfal-tui = "gfal_tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gfal_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "flaky: tests that may be retried when UI timing is noisy",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PTH",
]
ignore = [
    "E501",
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["gfal_tui"]

[tool.codespell]
skip = ".git,.venv,*.egg-info"
ignore-words-list = "cern,xrootd,fsspec,gfal,adler,aiohttp,thirdparty,scitag"
